    <style>
        .khung {

        .khungbu {
            border: 2px solid rgb(0,0,0);

            text-align: center;
            background-color: rgb(142, 221, 255);
            margin: auto;
            height: 1000px;
            width: 800px;
            border-radius: 10px 10px 10px 10px;
        } 
        table {
            margin: auto;
        }
    </style>
    </head>
    <body>
        <div class="khungbu">
        <div class="khung">
        <h2>Jackson</h2>
        <hr>
        <h2>Electronis</h2>
        </div>
        <h2 style="text-align: center; margin: 50px;">Registration Form</h2>
        <table border="">
            <tr>
                <td colspan="5" style="text-align: center;">Register your Jackson Electronics product here</td>
            </tr>
            <tr>
                <td>First Name:</td>
                <td colspan="2"><input type="text" size="20"></td>
                <td style="text-align:left;">Last Name: <input type="text" size="20"></td>
            </tr>
            <tr>
                <td>Address #1:</td>
                <td colspan="2"><input type="text" size="30"></td>
            </tr>
            <tr>
                <td>Address #1:</td>
                <td colspan="2"><input type="text" size="30"></td>
            </tr>
            <tr>
                <td style="text-align: left;">City:</td>
                <td colspan="2"><input type="text" size="20"></td>
                <td>State: <input type="text" size="5"> Zip: <input type="text" size="5"></td>
            </tr>
        </table>
        <hr style="border: none;
            border-top: 2px solid rgb(122, 120, 120);
            margin: 0px 0;
            width: 750px; margin: 8px; ">
        <table>
            <tr>
                <td>
                <label>Product:  </label></td>
                <td>
                <select id="product" name="product">
                <option selected>ScanMaster</option>
                <option>AnotherProduct</option>
                <option>SampleTool</option>
                </td>
            <tr>
                <td>Date Purchased:</td>
                <td colspan="3"><input type="text" size="30"></td>
            
            <tr>
                <td>Serial:</td>
                <td colspan="3"><input type="text" size="30"></td>
            </tr>
            <tr>
                <td rowspan="3">Used for: </td>
                <td> <input type="radio"><label>Home</label> </td>
                <td><input type="radio"><label>Educational Inst</label></td>
            </tr>
            <tr>
                <td> <input type="radio"><label>Business</label> </td>
                <td> <input type="radio"><label>Other</label> </td>
            </tr>
            <tr>
                <td><input type="radio"><label>Govermment</label>  </td>
            </tr>
            <tr>
                <td rowspan="2">System (check all that apply):</td>
                <td><input type="checkbox"><label>Windows</label></td>
                <td><input type="checkbox"><label>UNIX</label></td>
            </tr>
            <tr>
                <td><input type="checkbox"><label for="mt">Macintosh</label></td>
                <td><input type="checkbox"><label for="ot">Other</label></td>
            </tr>
        </table>
        <hr style="border: none;
            border-top: 2px solid rgb(122, 120, 120);
            margin: 0px 0;
            width: 750px; margin: 8px; ">
        <table>
            <tr>
            <td>Comments?:</td>
            <td><textarea rows="10" cols="80"></textarea></td>
            </tr>
        </table>
        <table>
            <tr>
                <td colspan="1"><button type="submit" >Click to register</button></td>
                <td colspan=""><button type="submit">Click to cancel</button></td>
            </tr>
        </table>
        </div>
