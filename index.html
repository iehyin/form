<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JACKSON ELECTRONICS</title>
    <style>
        .khung {
            border: 1px solid rgb(0, 0, 0);
            border-radius: 10px 10px 10px 10px;
            height: 85px;
            width: 300px;
            margin: auto;
            background-color: rgb(18, 236, 228);
            font-size: larger;
            box-shadow: 7px 7px 7px;
            text-align: center;
        }

        h2 {
            margin: 3px;
        }

        .khung hr {
            border: none;
            border-top: 4px solid rgba(0, 0, 0);
            margin: 0px 0;
            width: 300px;
        }
        .container {
            border: 2px solid rgb(0, 0, 0);
            padding: 5px;
            background-color: rgb(162, 213, 235);
            margin: auto;
            height: 700px;
            width: 800px;
            border-radius: 10px 10px 10px 10px;
        }

        .bang {
            margin: auto;
            width: 700px;
        }
    </style>
</head>
<body>
    <div class="container">
        <form>
            <div class="khung">
                <h2>Jackson</h2>
                <hr>
                <h2>Electronis</h2>
            </div>
            <h2 style="text-align: center; margin: 30px;">Registration Form</h2>
            <table class="bang" >
                <tbody>
                    <tr>
                    <td colspan="2" style="text-align: center;">Register your Jackson Electronics product here</td>
                </tr>
                <tr>
                    <td>First Name:</td>
                    <td>
                        <input type="text" size="20">
                        Last Name:
                        <input type="text" size="20">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="Address_1">Address #1</label>
                    </td>
                    <td>
                        <input type="text" id="Address_1">
                    </td>
                </tr>
                <tr>
                    <td>Address #2:</td>
                    <td>
                        <input type="text" id="Address_2">
                    </td>
                </tr>
                <tr>
                    <td>City:</td>
                    <td>
                        <input type="text" size="20">
                        State: <input type="text" size="3">
                        Zip: <input type="text" size="3">
                    </td>
                </tr>
                <tr>
                    <td>Country:</td>
                    <td>
                        <input type="text" size="20">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Product: </label>
                    </td>
                    <td>
                        <select id="product" name="product">
                            <option selected>ScanMaster</option>
                            <option>AnotherProduct</option>
                    </td>
                </tr>
                <tr>
                    <td>Date Purchased:</td>
                    <td><input type="text" size="24"></td>

                <tr>
                    <td>Serial:</td>
                    <td><input type="text" size="24"></td>
                </tr>
                <tr>
                    <td>Used for: </td>
                    <td>
                        <input type="radio" name="int"> <label style="width: 150px; display: inline-block;">Home</label>
                        <input type="radio" name="int"> <label style="width: 150px; display: inline-block;">Educational Institution</label>
                        <br>
                        <input type="radio" name="int"> <label style="width: 150px; display: inline-block;">Business</label>
                        <input type="radio" name="int"> <label style="width: 150px; display: inline-block;">Other</label>
                        <br>
                        <input type="radio" name="int"> <label style="width: 150px; display: inline-block;">Govermment</label> 
                    </td>
                </tr>
                <tr>
                    <td>
                        System(check all that apply):
                    </td>
                    <td>
                        <input type="checkbox" id="Windows" >
                            <label style="width: 150px; display: inline-block;" for="Windows">Windows</label>
                        <input type="checkbox" id="UNIX" >
                            <label style="width: 150px; display: inline-block;" for="UNIX">UNIX</label>
                        <br>
                        <input type="checkbox" id="Macintosh" >
                            <label for="Macintosh" style="width: 150px; display: inline-block;">Macintosh</label>
                        <input type="checkbox" id="Other">
                            <label for="Other" style="width: 150px; display: inline-block;"> Other</label>
                    </td>
                </tr>
                <tr>
                    <td style="vertical-align: top; text-align: left; ">Comments?:</td>
                    <td><textarea style="width: 200"></textarea></td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align: center;">
                        <button type="submit" style="padding: 2px 40px; box-shadow:1px 1px ;">Click to register</button>
                        <button type="submit" style="padding: 2px 40px; box-shadow:1px 1px ;">Click to cancel</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </form>
    </div>
</body>

</html>
