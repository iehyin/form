<!DOCTYPE html>
<html>
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>JACKSON ELECTRONICS</title>
    <style>
        .khung {
            border: 1px solid rgb(0,0,0);
            border-radius: 10px 10px 10px 10px ;
            height: 85px;
            width: 300px;
            text-align: center;
            margin: auto;
            background-color: rgb(18, 236, 228);
            font-size: larger;
            box-shadow: 7px 7px 7px;
        }
        h2 {
            margin: 3px;
        }
        hr {
            border: none;
            border-top: 4px solid rgba(0,0,0);
            margin: 0px 0;
            width: 300px;
        }
        .khungbu {
            border: 2px solid rgb(0,0,0);
            padding: 5px;
            text-align: center;
            background-color: rgb(162, 213, 235);
            margin: auto;
            height: 800px;
            width: 800px;
            border-radius: 10px 10px 10px 10px;
        } 
        .bang {
            margin: auto;
            width: 700px;
        }
    </style>
    </head>
    <body>
    <div class="khungbu">
        <form>
        <div class="khung">
            <h2>Jackson</h2>
            <hr>
            <h2>Electronis</h2>
        </div>
        <h2 style="text-align: center; margin: 30px;">Registration Form</h2>
        <table class="bang">
            <tr>
                <td colspan="7" style="text-align: center;">Register your Jackson Electronics product here</td>
            </tr>
            <tr>
                <td style="text-align:left;">First Name:</td>
                <td colspan="2" style="text-align: right;">
                    <input type="text" size="20">
                </td>
                <td style="text-align:left;" width="80">Last Name: </td>
                    <td style="text-align:left;"><input type="text" size="20">
                </td>
            </tr>
            <tr>
                <td style="text-align:left;">Address #1:</td>
                <td style="text-align:right;" colspan="3"><input type="text" style="width:75%"></td>
            </tr>
            <tr>
                <td style="text-align:left;">Address #2:</td>
                <td style="text-align:right;" colspan="3"><input type="text" style="width:75%"></td>
            </tr>
            <tr>
                <td style="text-align:left;">City:</td>
                <td style="text-align:right;" colspan="2"><input type="text" size="20"></td>
                <td width="100" colspan="3" style="text-align: left;">State: <input type="text" size="3">  Zip: <input type="text" size="3"></td>
            </tr>
            <tr>
                <td style="text-align:left;">Country:</td>
                <td style="text-align:right;" colspan="2"><input type="text" size="20"></td>
            </tr>
        </table>
        <hr style="border: none;
            border-top: 2px solid rgb(122, 120, 120);
            width: 700px; margin: 8px; margin: auto; margin-top: 20px; margin-bottom: 20px;" >
        <table class="bang">
            <tr>
                <td style="text-align:left;" width="27%">
                <label>Product: </label></td>
                <td width="40%" style="text-align:left;" >
                <select id="product" name="product">
                <option selected>ScanMaster</option>
                <option>AnotherProduct</option>
                </td>
            </tr>
            <tr>
                <td style="text-align:left;" >Date Purchased:</td>
                <td style="text-align:left; width: 80%;" width="60%" ><input type="text" size="24"></td>
            
            <tr>
                <td style="text-align:left;">Serial:</td>
                <td style="text-align:left;"><input type="text" size="24"></td>
            </tr>
            <tr>
                <td style="vertical-align: top; text-align: left;" rowspan="3">Used for: </td>
                <td style="text-align:left;"> 
                    <input type="radio"> <label>Home</label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <input type="radio"> <label >Educational Institution</label>
            <tr>
                <td style="text-align:left;">
                    <input type="radio"> <label>Business</label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <input type="radio"> <label>Other</label>
                </td>
            </tr>
            <tr>
                <td style="text-align:left;"><input type="radio"> <label>Govermment</label>  </td>
            </tr>
            <tr>
                <td rowspan="2" style="text-align:left;">System(check all that apply):</td>
                <td style="text-align:left;" ><input type="checkbox"><label>Windows</label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <input type="checkbox"><label>UNIX</label></td>
            </tr>
            <tr>
                <td style="text-align:left;"><input type="checkbox"><label for="mt">Macintosh</label>&nbsp;&nbsp;&nbsp;&nbsp;
                <input type="checkbox"><label for="ot">Other</label></td>
            </tr>
        </table>
        <hr style="border: none;
            border-top: 2px solid rgb(122, 120, 120);
            width: 700px; margin: 8px; margin: auto; margin-top: 20px; margin-bottom: 20px;" >
        <table class="bang">
        <tr>
            <td style="vertical-align: top; text-align: left;">Comments?:</td>
            <td><textarea rows="10" cols="70" style="text-align:left;" ></textarea></td>
            </tr>
        <tr>
            <td style="text-align:center;" colspan="2" >
            <button type="submit" style="padding: 2px 40px; box-shadow:1px 1px ;" >Click to register</button>
            <button type="submit" style="padding: 2px 40px; box-shadow:1px 1px ;" >Click to cancel</button>
        </td>
        </tr>
        </table>
        </form>
    </div>
    </body>
</html>
